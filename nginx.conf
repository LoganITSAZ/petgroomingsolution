events {
  worker_connections 1024;
}

http {
  upstream app {
    server app:3000;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name gentlegroomer.net www.gentlegroomer.net;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name gentlegroomer.net www.gentlegroomer.net;

    ssl_certificate     /etc/letsencrypt/live/gentlegroomer.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gentlegroomer.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SSE — disable proxy buffering so events stream immediately
    location /api/station/ {
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
    }

    location / {
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
