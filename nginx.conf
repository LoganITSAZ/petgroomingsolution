# Plain HTTP. Works on a fresh box with no certificates.
# For HTTPS: get certificates, then set NGINX_CONF=./nginx.tls.conf in .env
# and run `docker compose up -d nginx`.

events {
  worker_connections 1024;
}

http {
  # Re-resolve the app through Docker's DNS: a deploy or a restart can hand
  # the container a new address, and nginx would otherwise keep proxying to the
  # old one — a 502 until nginx itself restarted.
  resolver 127.0.0.11 valid=10s;
  upstream app {
    zone app 64k;
    server app:3000 resolve;
  }

  server {
    listen 80;
    server_name _;

    # Certbot's webroot challenge, so certificates can be issued without
    # taking the site down.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Station displays stream server-sent events: no buffering, no timeout.
    location /api/station/ {
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
    }

    location / {
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
