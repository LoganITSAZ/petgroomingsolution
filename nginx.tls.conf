events {
  worker_connections 1024;
}

http {
  # Re-resolve the app through Docker's DNS: a deploy or a restart can hand
  # the container a new address, and nginx would otherwise keep proxying to the
  # old one — a 502 until nginx itself restarted.
  resolver 127.0.0.11 valid=10s;
  upstream app {
    zone app 64k;
    server app:3000 resolve;
  }

  # Sign-in, registration and password-reset posts per client address. Each
  # costs a bcrypt hash or an email: someone mistyping a password never
  # notices, a script guessing one stalls. Every other request has an empty
  # key, which nginx does not count.
  map "$request_method $uri" $auth_client {
    "~^POST /(api/auth/callback/|register|forgot-password|reset-password)" $binary_remote_addr;
    default "";
  }
  limit_req_zone $auth_client zone=auth:1m rate=10r/m;
  limit_req_status 429;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name your-domain.example www.your-domain.example;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name your-domain.example www.your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SSE — disable proxy buffering so events stream immediately
    location /api/station/ {
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
    }

    location / {
      limit_req          zone=auth burst=10 nodelay;
      proxy_pass         http://app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
