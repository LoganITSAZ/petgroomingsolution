# Deploy: cp .env.example .env, fill in the two required values, then
#   docker compose up -d --build
# Migrations and baseline data run automatically before the app starts.

services:
  db:
    image: postgres:16-alpine
    container_name: gentlegroomer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gentlegroomer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gentlegroomer"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback only: the app reaches Postgres over the internal network, and
    # local tools can still use localhost:5432.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal

  # Runs to completion, then the app starts. This is what makes a deploy a
  # single command.
  migrate:
    build:
      context: .
      target: toolbox
    container_name: gentlegroomer_migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gentlegroomer
      SEED_ON_START: ${SEED_ON_START:-true}
      SHOP_NAME: ${SHOP_NAME:-Your Grooming Shop}
      SHOP_PHONE: ${SHOP_PHONE:-}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-}
      SHOP_WEBSITE: ${SHOP_WEBSITE:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # Empty falls back to admin@<the shop's own domain> — see lib/branding.ts.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # No default: a built-in initial password is one the whole internet
      # knows. The seed refuses to create the first admin without it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
    container_name: gentlegroomer_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gentlegroomer
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - generate one with openssl rand -base64 32}"
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: gentlegroomer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Defaults to plain HTTP so a fresh box works immediately. Once
      # certificates exist, set NGINX_CONF=./nginx.tls.conf in .env.
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
